<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 外部への通信をすべて禁止（入力内容を送信しないことをブラウザ側でも保証する） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Claudeで作った、ブラウザで動くシンプルなテキストエディタ（学習・検証目的の非公式作品）">
<meta name="theme-color" content="#f0f0f0">
<title>無題 - つくってためそ メモ帳 Claude版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2.5' y='1.5' width='11' height='13' rx='1.5' fill='%23fffdf5' stroke='%23555'/%3E%3Cpath d='M5 5h6M5 7.5h6M5 10h4' stroke='%23e07a2e' stroke-width='1.2'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --chrome: #f0f0f0;
    --line: #d6d6d6;
    --text: #1f1f1f;
    --muted: #6b6b6b;
    --hover: #e3ecf7;
    --hover-line: #b9cde6;
    --accent: #2f6fb7;
    --menu-bg: #fafafa;
    --hl: rgba(51, 136, 255, .38);
    --ui-font: "Yu Gothic UI", "Meiryo UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    font: 12px/1.4 var(--ui-font);
    color: var(--text);
    background: var(--chrome);
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; }

  /* タイトルバー風 */
  .titlebar {
    display: flex; align-items: center; gap: 8px;
    height: 30px; padding: 0 10px;
    background: var(--chrome);
    flex: none; user-select: none; -webkit-user-select: none;
  }
  .titlebar svg { flex: none; }
  .titlebar h1 {
    margin: 0; font-size: 12px; font-weight: normal;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* メニューバー */
  .menubar {
    display: flex; align-items: stretch;
    height: 24px; padding: 0 2px;
    background: #fff; border-bottom: 1px solid var(--line);
    flex: none; position: relative; z-index: 20;
    user-select: none; -webkit-user-select: none;
  }
  .menu { position: relative; }
  .menu-btn {
    height: 100%; padding: 0 8px;
    background: none; border: 1px solid transparent; cursor: default;
  }
  .menu-btn:hover, .menu.open .menu-btn { background: var(--hover); border-color: var(--hover-line); }
  .menu-btn:focus-visible { outline: 1px dotted var(--text); outline-offset: -3px; }
  .dropdown {
    display: none; position: absolute; left: 0; top: 100%;
    min-width: 240px; max-width: calc(100vw - 8px);
    padding: 3px 0;
    background: var(--menu-bg); border: 1px solid #c9c9c9;
    box-shadow: 2px 3px 8px rgba(0,0,0,.18);
  }
  .menu.open .dropdown { display: block; }
  .dropdown button {
    display: flex; align-items: center; width: 100%;
    padding: 4px 16px 4px 4px;
    background: none; border: 0; text-align: left; cursor: default;
    white-space: nowrap;
  }
  .dropdown button .ck { width: 22px; flex: none; text-align: center; }
  .dropdown button .lb { flex: 1; }
  .dropdown button kbd { font: inherit; color: var(--muted); margin-left: 28px; }
  .dropdown button:hover:not(:disabled), .dropdown button:focus-visible { background: var(--hover); outline: none; }
  .dropdown button:disabled { color: #a3a3a3; }
  .dropdown button:disabled kbd { color: #b8b8b8; }
  .dropdown hr { border: 0; border-top: 1px solid #dcdcdc; margin: 3px 2px 3px 26px; }

  /* 編集エリア */
  .editor-wrap { position: relative; flex: 1; min-height: 0; background: #fff; }
  #editor {
    display: block; width: 100%; height: 100%;
    margin: 0; padding: 2px 4px; border: 0; outline: none; resize: none;
    background: #fff; color: #000;
    font-family: "BIZ UDGothic", "MS Gothic", "Osaka-Mono", Menlo, Consolas, monospace;
    font-size: 12pt; line-height: 1.4;
    white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal;
    tab-size: 8; -moz-tab-size: 8;
    overflow: auto;
  }
  #editor.nowrap { white-space: pre; overflow-wrap: normal; }
  .hl-layer { position: absolute; left: 0; top: 0; overflow: hidden; pointer-events: none; }
  .hl-layer div { position: absolute; background: var(--hl); }
  .mirror {
    position: fixed; left: -100000px; top: 0; visibility: hidden;
    box-sizing: border-box; border: 0; margin: 0; overflow: visible; height: auto;
  }
  .drop-hint {
    position: absolute; inset: 8px; display: none;
    align-items: center; justify-content: center;
    border: 2px dashed var(--accent); border-radius: 6px;
    background: rgba(47,111,183,.06); color: var(--accent); font-size: 14px;
    pointer-events: none;
  }
  .editor-wrap.dragging .drop-hint { display: flex; }

  /* ステータスバー */
  .statusbar {
    display: flex; align-items: stretch; justify-content: flex-end;
    height: 24px; flex: none;
    background: var(--chrome); border-top: 1px solid var(--line);
    user-select: none; -webkit-user-select: none;
    white-space: nowrap; overflow: hidden;
  }
  .statusbar[hidden] { display: none; }
  .statusbar > * {
    display: flex; align-items: center;
    padding: 0 12px; border-left: 1px solid var(--line);
  }
  .statusbar .sp { flex: 1; border-left: 0; }
  #stPos { min-width: 150px; }
  #stEol { background: none; border-top: 0; border-right: 0; border-bottom: 0; cursor: pointer; }
  #stEol:hover { background: var(--hover); }

  .notice {
    flex: none; padding: 3px 8px calc(3px + env(safe-area-inset-bottom));
    font-size: 10.5px; color: var(--muted); text-align: center;
    background: var(--chrome); border-top: 1px solid var(--line);
  }

  /* 検索・置換パネル */
  .panel {
    position: absolute; right: 18px; top: 8px; z-index: 15;
    width: 380px; max-width: calc(100% - 16px);
    background: var(--menu-bg); border: 1px solid #b9b9b9;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
  }
  .panel[hidden] { display: none; }
  .panel-head, .dlg-head {
    display: flex; align-items: center; justify-content: space-between;
    height: 28px; padding: 0 2px 0 10px;
    background: #fff; border-bottom: 1px solid var(--line);
  }
  .x {
    width: 34px; height: 26px; border: 0; background: none; cursor: pointer; font-size: 16px; line-height: 1;
  }
  .x:hover { background: #e81123; color: #fff; }
  .panel-body { padding: 10px; display: grid; gap: 8px; }
  .row { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 6px; }
  .row input[type=text], .row select, .row input[type=number] {
    width: 100%; height: 26px; padding: 2px 6px;
    font: inherit; font-size: 13px; border: 1px solid #a9a9a9; border-radius: 2px; background: #fff;
  }
  .row input:focus, .row select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .opts { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
  .opts label { display: inline-flex; align-items: center; gap: 4px; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .btn {
    min-width: 88px; height: 28px; padding: 0 12px;
    background: #fdfdfd; border: 1px solid #adadad; border-radius: 3px; cursor: pointer;
  }
  .btn:hover { background: var(--hover); border-color: var(--hover-line); }
  .btn.primary { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .msg { min-height: 1.4em; color: #b3261e; }
  .msg.ok { color: #1d6b2f; }
  .panel .rep { display: none; }
  .panel.replace .rep { display: grid; }
  .panel.replace .btns .rep { display: inline-block; }
  .linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; justify-self: start; }

  /* ダイアログ */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.18); padding: 12px;
  }
  .dialog {
    width: 420px; max-width: 100%; max-height: 100%; overflow: auto;
    background: var(--menu-bg); border: 1px solid #9a9a9a;
    box-shadow: 0 10px 32px rgba(0,0,0,.28);
  }
  .dlg-body { padding: 16px 16px 8px; display: grid; gap: 10px; font-size: 13px; }
  .dlg-body p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .dlg-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 16px 14px; }
  .note { color: var(--muted); font-size: 11.5px; }
  .preview {
    height: 76px; overflow: hidden; display: flex; align-items: center; justify-content: center;
    border: 1px solid #c9c9c9; background: #fff; padding: 4px 8px; white-space: nowrap;
  }

  .toast {
    position: fixed; left: 50%; bottom: 64px; z-index: 120;
    transform: translate(-50%, 8px); opacity: 0;
    max-width: calc(100vw - 32px);
    padding: 8px 14px; border-radius: 4px;
    background: rgba(32,32,32,.92); color: #fff; font-size: 12.5px;
    pointer-events: none; transition: opacity .18s, transform .18s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* スマホ向け */
  @media (max-width: 640px) {
    .titlebar { height: 32px; }
    .menubar { height: 36px; }
    .menu-btn { padding: 0 12px; font-size: 13px; }
    .dropdown { min-width: 230px; position: fixed; left: 4px; top: auto; }
    .dropdown button { padding: 9px 16px 9px 4px; font-size: 14px; }
    .dropdown button kbd { display: none; }
    .statusbar > * { padding: 0 8px; }
    #stPos { min-width: 0; }
    .hide-sm { display: none !important; }
    .panel { left: 4px; right: 4px; top: 4px; width: auto; max-width: none; }
    .row { grid-template-columns: 1fr; gap: 3px; }
    .row input[type=text], .row select, .row input[type=number] { height: 34px; font-size: 16px; }
    .btn { height: 34px; }
    .notice .wide { display: none; }
    .notice { font-size: 9.5px; letter-spacing: -.02em; }
  }
</style>
</head>
<body>
<noscript><p style="padding:12px">このページを使うには JavaScript を有効にしてください。</p></noscript>

<header class="titlebar">
  <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
    <rect x="2.5" y="1.5" width="11" height="13" rx="1.5" fill="#fffdf5" stroke="#555"/>
    <path d="M5 5h6M5 7.5h6M5 10h4" stroke="#e07a2e" stroke-width="1.2"/>
  </svg>
  <h1 id="title">無題 - つくってためそ メモ帳 Claude版</h1>
</header>

<nav class="menubar" role="menubar" aria-label="メニュー">
  <div class="menu" data-menu="file" data-key="f">
    <button class="menu-btn" aria-haspopup="true" aria-expanded="false">ファイル(<u>F</u>)</button>
    <div class="dropdown" role="menu">
      <button role="menuitem" data-cmd="new"><span class="ck"></span><span class="lb">新規</span><kbd>Ctrl+Alt+N</kbd></button>
      <button role="menuitem" data-cmd="open"><span class="ck"></span><span class="lb">開く...</span><kbd>Ctrl+O</kbd></button>
      <button role="menuitem" data-cmd="save"><span class="ck"></span><span class="lb">保存</span><kbd>Ctrl+S</kbd></button>
      <button role="menuitem" data-cmd="saveAs"><span class="ck"></span><span class="lb">名前を付けて保存...</span><kbd>Ctrl+Shift+S</kbd></button>
    </div>
  </div>
  <div class="menu" data-menu="edit" data-key="e">
    <button class="menu-btn" aria-haspopup="true" aria-expanded="false">編集(<u>E</u>)</button>
    <div class="dropdown" role="menu">
      <button role="menuitem" data-cmd="undo"><span class="ck"></span><span class="lb">元に戻す</span><kbd>Ctrl+Z</kbd></button>
      <button role="menuitem" data-cmd="redo"><span class="ck"></span><span class="lb">やり直し</span><kbd>Ctrl+Y</kbd></button>
      <hr>
      <button role="menuitem" data-cmd="cut"><span class="ck"></span><span class="lb">切り取り</span><kbd>Ctrl+X</kbd></button>
      <button role="menuitem" data-cmd="copy"><span class="ck"></span><span class="lb">コピー</span><kbd>Ctrl+C</kbd></button>
      <button role="menuitem" data-cmd="paste"><span class="ck"></span><span class="lb">貼り付け</span><kbd>Ctrl+V</kbd></button>
      <button role="menuitem" data-cmd="del"><span class="ck"></span><span class="lb">削除</span><kbd>Del</kbd></button>
      <hr>
      <button role="menuitem" data-cmd="find"><span class="ck"></span><span class="lb">検索...</span><kbd>Ctrl+F</kbd></button>
      <button role="menuitem" data-cmd="findNext"><span class="ck"></span><span class="lb">次を検索</span><kbd>F3</kbd></button>
      <button role="menuitem" data-cmd="findPrev"><span class="ck"></span><span class="lb">前を検索</span><kbd>Shift+F3</kbd></button>
      <button role="menuitem" data-cmd="replace"><span class="ck"></span><span class="lb">置換...</span><kbd>Ctrl+H</kbd></button>
      <hr>
      <button role="menuitem" data-cmd="selectAll"><span class="ck"></span><span class="lb">すべて選択</span><kbd>Ctrl+A</kbd></button>
      <button role="menuitem" data-cmd="dateTime"><span class="ck"></span><span class="lb">日付と時刻</span><kbd>F5</kbd></button>
    </div>
  </div>
  <div class="menu" data-menu="view" data-key="v">
    <button class="menu-btn" aria-haspopup="true" aria-expanded="false">表示(<u>V</u>)</button>
    <div class="dropdown" role="menu">
      <button role="menuitem" data-cmd="font"><span class="ck"></span><span class="lb">フォント...</span><kbd></kbd></button>
      <hr>
      <button role="menuitem" data-cmd="zoomIn"><span class="ck"></span><span class="lb">拡大</span><kbd>Ctrl++</kbd></button>
      <button role="menuitem" data-cmd="zoomOut"><span class="ck"></span><span class="lb">縮小</span><kbd>Ctrl+-</kbd></button>
      <button role="menuitem" data-cmd="zoomReset"><span class="ck"></span><span class="lb">既定のズームに戻す</span><kbd>Ctrl+0</kbd></button>
      <hr>
      <button role="menuitemcheckbox" data-cmd="wrap" aria-checked="true"><span class="ck"></span><span class="lb">右端で折り返す</span><kbd></kbd></button>
      <button role="menuitemcheckbox" data-cmd="status" aria-checked="true"><span class="ck"></span><span class="lb">ステータスバー</span><kbd></kbd></button>
    </div>
  </div>
</nav>

<main class="editor-wrap" id="wrap">
  <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off"
            wrap="soft" aria-label="テキスト編集エリア"></textarea>
  <div class="hl-layer" id="hlLayer" aria-hidden="true"></div>
  <div class="drop-hint">ここにテキストファイルをドロップして開く</div>

  <section class="panel" id="findPanel" role="dialog" aria-labelledby="findTitle" hidden>
    <div class="panel-head">
      <span id="findTitle">検索</span>
      <button class="x" id="findClose" title="閉じる (Esc)" aria-label="閉じる">×</button>
    </div>
    <div class="panel-body">
      <label class="row"><span>検索する文字列:</span><input type="text" id="findInput" autocomplete="off" spellcheck="false"></label>
      <label class="row rep"><span>置換後の文字列:</span><input type="text" id="replaceInput" autocomplete="off" spellcheck="false"></label>
      <div class="opts">
        <label><input type="checkbox" id="optCase">大文字と小文字を区別する</label>
        <label><input type="checkbox" id="optWrap" checked>折り返して検索</label>
        <span class="opts" role="radiogroup" aria-label="方向">
          <label><input type="radio" name="dir" value="up" id="dirUp">上へ</label>
          <label><input type="radio" name="dir" value="down" id="dirDown" checked>下へ</label>
        </span>
      </div>
      <div class="btns">
        <button class="btn primary" id="btnFindNext">次を検索</button>
        <button class="btn rep" id="btnReplace">置換して次へ</button>
        <button class="btn rep" id="btnReplaceAll">すべて置換</button>
      </div>
      <button class="linkbtn" id="toggleReplace">置換も行う</button>
      <div class="msg" id="findMsg" role="status" aria-live="polite"></div>
    </div>
  </section>
</main>

<footer class="statusbar" id="statusbar" aria-label="ステータスバー">
  <span class="sp"></span>
  <span id="stPos">行 1、列 1</span>
  <span id="stCount">0 文字</span>
  <span id="stZoom" class="hide-sm">100%</span>
  <button id="stEol" class="hide-sm" title="保存時の改行コード（クリックで切り替え）">CRLF</button>
  <span id="stEnc" class="hide-sm">UTF-8</span>
</footer>
<div class="notice">学習・検証目的の非公式作品です。実在のソフトの開発元とは関係ありません。<span class="wide">　入力内容はこのブラウザ内にのみ保存され、外部へは送信されません。</span></div>

<input type="file" id="fileInput" accept=".txt,text/plain" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const APP = 'つくってためそ メモ帳 Claude版';
  const KEY_DOC = 'tsukutte-memo:doc:v1';
  const KEY_SET = 'tsukutte-memo:settings:v1';
  const MAX_FILE = 20 * 1024 * 1024;

  const $ = (s) => document.querySelector(s);
  const ed = $('#editor');
  const wrapEl = $('#wrap');

  // ---------- localStorage（失敗しても動き続ける） ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  };
  const parse = (s) => { try { return JSON.parse(s) || {}; } catch { return {}; } };

  // ---------- 設定 ----------
  const FONTS = [
    { id: 'mono',   label: '等幅（既定）', stack: '"BIZ UDGothic", "MS Gothic", "Osaka-Mono", Menlo, Consolas, monospace' },
    { id: 'gothic', label: 'ゴシック体',   stack: '"Yu Gothic UI", "Yu Gothic", YuGothic, Meiryo, "Hiragino Sans", "Noto Sans JP", sans-serif' },
    { id: 'mincho', label: '明朝体',       stack: '"Yu Mincho", YuMincho, "Hiragino Mincho ProN", "Noto Serif JP", "MS Mincho", serif' },
    { id: 'round',  label: '丸ゴシック体', stack: '"Hiragino Maru Gothic ProN", "Kosugi Maru", "M PLUS Rounded 1c", "BIZ UDPGothic", sans-serif' },
    { id: 'system', label: 'システム標準', stack: 'system-ui, -apple-system, sans-serif' },
  ];
  const STYLES = [
    { id: 'normal', label: '標準' },
    { id: 'italic', label: '斜体' },
    { id: 'bold', label: '太字' },
    { id: 'bolditalic', label: '太字 斜体' },
  ];
  const settings = Object.assign(
    { font: 'mono', size: 12, style: 'normal', wrap: true, status: true, zoom: 100 },
    parse(store.get(KEY_SET))
  );
  const saveSettings = () => store.set(KEY_SET, JSON.stringify(settings));

  // ---------- 文書の状態 ----------
  const doc = { name: '', dirty: false, eol: 'CRLF' };
  const displayName = () => doc.name || '無題';

  function updateTitle() {
    const t = (doc.dirty ? '*' : '') + displayName() + ' - ' + APP;
    $('#title').textContent = t;
    document.title = t;
  }

  // ---------- トースト ----------
  let toastTimer;
  function toast(msg, ms = 2600) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  // ---------- 元に戻す／やり直し（独自の履歴） ----------
  const H = { undo: [], redo: [], lastKind: '', lastTime: 0, LIMIT: 300 };
  const snap = () => ({ t: ed.value, s: ed.selectionStart, e: ed.selectionEnd });
  function pushUndo(st) {
    H.undo.push(st);
    if (H.undo.length > H.LIMIT) H.undo.shift();
    H.redo.length = 0;
  }
  const breakGroup = () => { H.lastKind = ''; };
  function resetHistory() { H.undo = []; H.redo = []; breakGroup(); }

  // 入力のまとまり（連続した文字入力など）を1回の「元に戻す」にまとめる
  function recordEdit(kind, force) {
    const now = Date.now();
    const hasSel = ed.selectionStart !== ed.selectionEnd;
    if (force || kind === 'other' || kind !== H.lastKind || now - H.lastTime > 1000 || hasSel) {
      pushUndo(snap());
    } else {
      H.redo.length = 0;
    }
    H.lastKind = kind === 'other' ? '' : kind;
    H.lastTime = now;
  }
  function restore(st) {
    ed.value = st.t;
    ed.setSelectionRange(st.s, st.e);
    breakGroup();
    changed();
    ensureVisible(st.s, st.e);
  }
  function undo() { if (!H.undo.length) return; H.redo.push(snap()); restore(H.undo.pop()); }
  function redo() { if (!H.redo.length) return; H.undo.push(snap()); restore(H.redo.pop()); }

  // プログラムからの編集（置換・貼り付けなど）
  function editRange(text, s, e, selMode = 'end', kind = 'other') {
    recordEdit(kind, kind === 'other');
    ed.setRangeText(text, s, e, selMode);
    changed();
  }

  ed.addEventListener('beforeinput', (e) => {
    const t = e.inputType || '';
    if (t === 'historyUndo') { e.preventDefault(); undo(); return; }
    if (t === 'historyRedo') { e.preventDefault(); redo(); return; }
    if (e.isComposing || t === 'insertCompositionText' || t === 'deleteCompositionText' || t === 'insertFromComposition') return;
    const kind = t.startsWith('insertText') ? 'type' : t.startsWith('delete') && !t.includes('By') ? 'del' : 'other';
    recordEdit(kind, false);
  });
  ed.addEventListener('compositionstart', () => recordEdit('ime', true));
  ed.addEventListener('input', changed);

  function changed() {
    doc.dirty = true;
    updateTitle();
    scheduleSave();
    scheduleStatus(true);
    clearHighlight();
  }

  // ---------- 自動保存 ----------
  let saveTimer, quotaWarned = false;
  function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
  function saveNow() {
    clearTimeout(saveTimer);
    const ok = store.set(KEY_DOC, JSON.stringify({
      v: 1, text: ed.value, name: doc.name, dirty: doc.dirty, eol: doc.eol,
      s: ed.selectionStart, e: ed.selectionEnd, top: ed.scrollTop, at: Date.now(),
    }));
    if (!ok && !quotaWarned) {
      quotaWarned = true;
      toast('自動保存できませんでした（ブラウザの保存容量を超えた可能性があります）', 6000);
    } else if (ok) {
      quotaWarned = false;
    }
  }
  window.addEventListener('pagehide', saveNow);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });

  // ---------- ステータスバー ----------
  const seg = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter('ja', { granularity: 'grapheme' }) : null;
  function countChars(str) {
    str = str.replace(/\n/g, '');
    let n = 0;
    if (seg && str.length < 200000) { for (const _ of seg.segment(str)) n++; return n; }
    for (const _ of str) n++;
    return n;
  }
  let totalCount = 0, statusRaf = 0, countTimer;
  function scheduleStatus(textChanged) {
    if (textChanged) {
      clearTimeout(countTimer);
      countTimer = setTimeout(() => { totalCount = countChars(ed.value); renderStatus(); }, 120);
    }
    if (!statusRaf) statusRaf = requestAnimationFrame(() => { statusRaf = 0; renderStatus(); });
  }
  function renderStatus() {
    const v = ed.value;
    const s = ed.selectionStart, e = ed.selectionEnd;
    const caret = ed.selectionDirection === 'backward' ? s : e;
    let line = 1;
    for (let i = v.indexOf('\n'); i !== -1 && i < caret; i = v.indexOf('\n', i + 1)) line++;
    const ls = v.lastIndexOf('\n', caret - 1) + 1;
    let col = 1;
    for (const _ of v.slice(ls, caret)) col++;
    $('#stPos').textContent = `行 ${line}、列 ${col}`;
    $('#stCount').textContent = s !== e
      ? `${countChars(v.slice(s, e))} / ${totalCount} 文字`
      : `${totalCount} 文字`;
    $('#stZoom').textContent = settings.zoom + '%';
    $('#stEol').textContent = doc.eol;
  }
  ['keyup', 'mouseup', 'select', 'focus', 'click'].forEach((t) => ed.addEventListener(t, () => scheduleStatus(false)));
  document.addEventListener('selectionchange', () => { if (document.activeElement === ed) scheduleStatus(false); });

  $('#stEol').addEventListener('click', () => {
    doc.eol = doc.eol === 'CRLF' ? 'LF' : 'CRLF';
    doc.dirty = true; updateTitle(); saveNow(); renderStatus();
    toast(`保存時の改行コードを ${doc.eol} にしました`);
  });

  // ---------- 表示設定の反映 ----------
  function applySettings() {
    const f = FONTS.find((x) => x.id === settings.font) || FONTS[0];
    ed.style.fontFamily = f.stack;
    ed.style.fontWeight = settings.style.includes('bold') ? 'bold' : 'normal';
    ed.style.fontStyle = settings.style.includes('italic') ? 'italic' : 'normal';
    ed.style.fontSize = (settings.size * settings.zoom / 100).toFixed(2) + 'pt';
    ed.classList.toggle('nowrap', !settings.wrap);
    ed.setAttribute('wrap', settings.wrap ? 'soft' : 'off');
    $('#statusbar').hidden = !settings.status;
    document.querySelector('[data-cmd="wrap"]').setAttribute('aria-checked', String(settings.wrap));
    document.querySelector('[data-cmd="status"]').setAttribute('aria-checked', String(settings.status));
    saveSettings();
    renderStatus();
    if (hl) drawHighlight(true);
  }
  function setZoom(z) {
    settings.zoom = Math.max(10, Math.min(500, Math.round(z / 10) * 10));
    applySettings();
  }

  // ---------- 位置計測（スクロールと検索ハイライト用） ----------
  const mirror = document.createElement('div');
  mirror.className = 'mirror';
  mirror.setAttribute('aria-hidden', 'true');
  document.body.appendChild(mirror);
  const COPY = ['fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'lineHeight', 'letterSpacing',
    'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft', 'tabSize', 'textIndent',
    'wordBreak', 'overflowWrap', 'whiteSpace', 'fontKerning', 'fontVariantLigatures'];
  function measure(s, e) {
    const cs = getComputedStyle(ed);
    for (const p of COPY) mirror.style[p] = cs[p];
    mirror.style.MozTabSize = cs.tabSize;
    mirror.style.width = ed.clientWidth + 'px';
    const t = ed.value;
    mirror.textContent = '';
    const sp = document.createElement('span');
    sp.textContent = t.slice(s, e) || '​';
    mirror.append(t.slice(0, s), sp, t.slice(e, e + 80).split('\n')[0] || ' ');
    const base = mirror.getBoundingClientRect();
    const rects = [...sp.getClientRects()]
      .filter((r) => r.width > 0 || s === e)
      .map((r) => ({ x: r.left - base.left, y: r.top - base.top, w: r.width, h: r.height }));
    mirror.textContent = '';
    return rects;
  }
  function ensureVisible(s, e) {
    const r = measure(s, e);
    if (!r.length) return r;
    const top = r[0].y, bottom = r[r.length - 1].y + r[r.length - 1].h;
    const ch = ed.clientHeight, cw = ed.clientWidth;
    if (top < ed.scrollTop || bottom > ed.scrollTop + ch) ed.scrollTop = Math.max(0, top - ch / 3);
    if (!settings.wrap) {
      const left = Math.min(...r.map((x) => x.x)), right = Math.max(...r.map((x) => x.x + x.w));
      if (left < ed.scrollLeft || right > ed.scrollLeft + cw) ed.scrollLeft = Math.max(0, left - cw / 3);
    } else {
      ed.scrollLeft = 0;
    }
    return r;
  }

  // 検索パネルにフォーカスがある間も、見つかった箇所がわかるようにハイライト表示する
  const hlLayer = $('#hlLayer');
  let hl = null; // { s, e, rects }
  function drawHighlight(remeasure) {
    if (!hl) { hlLayer.textContent = ''; return; }
    if (remeasure) hl.rects = measure(hl.s, hl.e);
    hlLayer.style.width = ed.clientWidth + 'px';
    hlLayer.style.height = ed.clientHeight + 'px';
    hlLayer.textContent = '';
    for (const r of hl.rects) {
      const d = document.createElement('div');
      d.style.left = (r.x - ed.scrollLeft) + 'px';
      d.style.top = (r.y - ed.scrollTop) + 'px';
      d.style.width = Math.max(2, r.w) + 'px';
      d.style.height = r.h + 'px';
      hlLayer.appendChild(d);
    }
  }
  function clearHighlight() { if (hl) { hl = null; hlLayer.textContent = ''; } }
  ed.addEventListener('scroll', () => { if (hl) drawHighlight(false); });
  ed.addEventListener('focus', clearHighlight);
  window.addEventListener('resize', () => { if (hl) drawHighlight(true); closeMenu(); });

  function selectRange(s, e) {
    ed.setSelectionRange(s, e);
    const rects = ensureVisible(s, e);
    if (document.activeElement !== ed) {
      hl = { s, e, rects };
      drawHighlight(false);
    }
    scheduleStatus(false);
  }

  // ---------- ダイアログ ----------
  let modalDepth = 0;
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function modal({ title, message, content, buttons, initial, onOpen }) {
    return new Promise((resolve) => {
      closeMenu();
      modalDepth++;
      const prevFocus = document.activeElement;
      const ov = el('div', 'overlay');
      const box = el('div', 'dialog');
      box.setAttribute('role', 'dialog');
      box.setAttribute('aria-modal', 'true');
      const head = el('div', 'dlg-head');
      const ttl = el('span', '', title || APP);
      ttl.id = 'dlgTitle' + modalDepth;
      box.setAttribute('aria-labelledby', ttl.id);
      const x = el('button', 'x', '×');
      x.setAttribute('aria-label', '閉じる');
      head.append(ttl, x);
      const body = el('div', 'dlg-body');
      if (message) body.appendChild(el('p', '', message));
      if (content) body.appendChild(content);
      const foot = el('div', 'dlg-foot');
      let primaryBtn = null;
      for (const b of buttons) {
        const btn = el('button', 'btn' + (b.primary ? ' primary' : ''), b.label);
        btn.addEventListener('click', () => done(b.value));
        if (b.primary) primaryBtn = btn;
        foot.appendChild(btn);
      }
      box.append(head, body, foot);
      ov.appendChild(box);
      document.body.appendChild(ov);

      const primaryValue = (buttons.find((b) => b.primary) || buttons[0]).value;
      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done('cancel'); return; }
        if (e.key === 'Enter' && !e.isComposing && e.target.tagName === 'INPUT') {
          e.preventDefault(); e.stopPropagation(); done(primaryValue); return;
        }
        if (e.key === 'Tab') {
          const f = [...box.querySelectorAll('button, input, select')].filter((n) => !n.disabled);
          if (!f.length) return;
          const i = f.indexOf(document.activeElement);
          if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); }
          else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
        }
      }
      let finished = false;
      function done(v) {
        if (finished) return;
        finished = true;
        document.removeEventListener('keydown', onKey, true);
        ov.remove();
        modalDepth--;
        resolve(v);
        if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus({ preventScroll: true });
      }
      x.addEventListener('click', () => done('cancel'));
      ov.addEventListener('mousedown', (e) => { if (e.target === ov) e.preventDefault(); });
      document.addEventListener('keydown', onKey, true);
      (initial || primaryBtn || x).focus();
      if (onOpen) onOpen();
    });
  }
  const alertBox = (message) => modal({ message, buttons: [{ label: 'OK', value: 'ok', primary: true }] });

  async function confirmDiscard() {
    if (!doc.dirty) return true;
    const r = await modal({
      message: `「${displayName()}」への変更内容を保存しますか？`,
      buttons: [
        { label: '保存する', value: 'save', primary: true },
        { label: '保存しない', value: 'discard' },
        { label: 'キャンセル', value: 'cancel' },
      ],
    });
    if (r === 'save') return await save(false);
    return r === 'discard';
  }

  async function askName(def) {
    const wrap = el('div');
    wrap.style.display = 'grid';
    wrap.style.gap = '8px';
    const row = el('label', 'row');
    const inp = el('input');
    inp.type = 'text';
    inp.value = def;
    inp.spellcheck = false;
    row.append(el('span', '', 'ファイル名:'), inp);
    wrap.append(row, el('div', 'note', 'ブラウザのダウンロード機能で保存します。保存先はブラウザの設定に従います。'));
    const r = await modal({
      title: '名前を付けて保存', content: wrap, initial: inp,
      buttons: [{ label: '保存', value: 'ok', primary: true }, { label: 'キャンセル', value: 'cancel' }],
      onOpen: () => { const dot = def.lastIndexOf('.'); inp.setSelectionRange(0, dot > 0 ? dot : def.length); },
    });
    if (r !== 'ok') return null;
    let n = inp.value.trim().replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_');
    if (!n || /^\.+$/.test(n)) n = '無題';
    if (!/\.[^.\s]{1,8}$/.test(n)) n += '.txt';
    return n;
  }

  async function fontDialog() {
    const box = el('div');
    box.style.display = 'grid';
    box.style.gap = '8px';
    const mkRow = (label, ctrl) => { const r = el('label', 'row'); r.append(el('span', '', label), ctrl); return r; };
    const fam = el('select');
    FONTS.forEach((f) => { const o = el('option', '', f.label); o.value = f.id; fam.appendChild(o); });
    fam.value = settings.font;
    const sty = el('select');
    STYLES.forEach((s) => { const o = el('option', '', s.label); o.value = s.id; sty.appendChild(o); });
    sty.value = settings.style;
    const size = el('input');
    size.type = 'number'; size.min = '6'; size.max = '96'; size.step = '1'; size.value = String(settings.size);
    size.setAttribute('list', 'fontSizes');
    const dl = el('datalist');
    dl.id = 'fontSizes';
    [8, 9, 10, 11, 12, 14, 16, 18, 20, 22, 24, 26, 28, 36, 48, 72].forEach((n) => { const o = el('option'); o.value = String(n); dl.appendChild(o); });
    const prev = el('div', 'preview', 'Aa あア亜 123');
    const upd = () => {
      const f = FONTS.find((x) => x.id === fam.value);
      prev.style.fontFamily = f.stack;
      prev.style.fontWeight = sty.value.includes('bold') ? 'bold' : 'normal';
      prev.style.fontStyle = sty.value.includes('italic') ? 'italic' : 'normal';
      const n = Math.max(6, Math.min(96, Number(size.value) || 12));
      prev.style.fontSize = Math.min(n, 36) + 'pt';
    };
    [fam, sty, size].forEach((c) => c.addEventListener('input', upd));
    upd();
    box.append(mkRow('フォント名:', fam), mkRow('スタイル:', sty), mkRow('サイズ (pt):', size), dl,
      el('div', 'note', 'プレビュー'), prev,
      el('div', 'note', '表示される書体はお使いの端末に入っているフォントによって変わります。'));
    const r = await modal({
      title: 'フォント', content: box, initial: fam,
      buttons: [{ label: 'OK', value: 'ok', primary: true }, { label: 'キャンセル', value: 'cancel' }],
    });
    if (r !== 'ok') return;
    settings.font = fam.value;
    settings.style = sty.value;
    settings.size = Math.max(6, Math.min(96, Math.round(Number(size.value) || 12)));
    applySettings();
  }

  // ---------- ファイル操作 ----------
  function newDoc() {
    ed.value = '';
    resetHistory();
    doc.name = ''; doc.dirty = false; doc.eol = 'CRLF';
    clearHighlight();
    updateTitle(); saveNow(); scheduleStatus(true);
    ed.focus();
  }

  function download(name) {
    let t = ed.value;
    if (doc.eol === 'CRLF') t = t.replace(/\n/g, '\r\n');
    const blob = new Blob([t], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  async function save(asNew) {
    let name = doc.name;
    if (asNew || !name) {
      name = await askName(name || '無題.txt');
      if (!name) return false;
    }
    download(name);
    doc.name = name;
    doc.dirty = false;
    updateTitle(); saveNow();
    toast(`「${name}」をダウンロードしました`);
    return true;
  }

  const fileInput = $('#fileInput');
  fileInput.addEventListener('change', async () => {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (f) await loadFile(f);
  });

  async function loadFile(f) {
    if (f.size > MAX_FILE) { await alertBox('ファイルが大きすぎます（20MB まで開けます）。'); return; }
    let buf;
    try { buf = await f.arrayBuffer(); } catch { await alertBox('ファイルを読み込めませんでした。'); return; }
    const u8 = new Uint8Array(buf);
    let text, enc = 'UTF-8';
    try {
      if (u8[0] === 0xFF && u8[1] === 0xFE) { text = new TextDecoder('utf-16le').decode(buf); enc = 'UTF-16 LE'; }
      else if (u8[0] === 0xFE && u8[1] === 0xFF) { text = new TextDecoder('utf-16be').decode(buf); enc = 'UTF-16 BE'; }
      else text = new TextDecoder('utf-8', { fatal: true }).decode(buf);
    } catch {
      try { text = new TextDecoder('shift_jis').decode(buf); enc = 'Shift_JIS'; }
      catch { text = new TextDecoder('utf-8').decode(buf); }
    }
    const eol = /\r\n/.test(text) ? 'CRLF' : /\n/.test(text) ? 'LF' : /\r/.test(text) ? 'CR' : 'CRLF';
    text = text.replace(/\r\n?/g, '\n');
    ed.value = text;
    ed.setSelectionRange(0, 0);
    ed.scrollTop = 0; ed.scrollLeft = 0;
    resetHistory();
    clearHighlight();
    doc.name = f.name; doc.dirty = false; doc.eol = eol === 'CR' ? 'CRLF' : eol;
    updateTitle(); saveNow(); scheduleStatus(true);
    ed.focus();
    if (enc !== 'UTF-8') toast(`${enc} として読み込みました（保存時は UTF-8 になります）`, 4500);
    else toast(`「${f.name}」を開きました`);
  }

  // ドラッグ＆ドロップでも開ける
  const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  let dragDepth = 0;
  wrapEl.addEventListener('dragenter', (e) => { if (hasFiles(e)) { dragDepth++; wrapEl.classList.add('dragging'); } });
  wrapEl.addEventListener('dragleave', (e) => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; wrapEl.classList.remove('dragging'); } });
  document.addEventListener('dragover', (e) => { if (hasFiles(e)) { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
  document.addEventListener('drop', async (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0; wrapEl.classList.remove('dragging');
    const f = e.dataTransfer.files[0];
    if (f && await confirmDiscard()) await loadFile(f);
  });

  // ---------- 編集コマンド ----------
  async function copySel(cut) {
    const s = ed.selectionStart, e = ed.selectionEnd;
    if (s === e) return;
    ed.focus();
    let ok = false;
    try { ok = document.execCommand(cut ? 'cut' : 'copy'); } catch { ok = false; }
    if (ok) return;
    try {
      await navigator.clipboard.writeText(ed.value.slice(s, e));
      if (cut) editRange('', s, e);
    } catch {
      toast('クリップボードを使えませんでした。Ctrl+C / Ctrl+X をお試しください', 4000);
    }
  }
  async function paste() {
    const s = ed.selectionStart, e = ed.selectionEnd;
    try {
      const t = await navigator.clipboard.readText();
      if (t) editRange(t.replace(/\r\n?/g, '\n'), s, e);
      ed.focus();
    } catch {
      toast('メニューからの貼り付けが許可されていません。Ctrl+V（スマホは長押し→ペースト）をお使いください', 5000);
      ed.focus();
    }
  }
  function delSel() {
    let s = ed.selectionStart, e = ed.selectionEnd;
    if (s === e) {
      if (s >= ed.value.length) return;
      const cp = ed.value.codePointAt(s);
      e = s + (cp > 0xFFFF ? 2 : 1);
    }
    editRange('', s, e);
    ed.focus();
  }
  function insertDateTime() {
    const d = new Date();
    const p = (n) => String(n).padStart(2, '0');
    const str = `${d.getHours()}:${p(d.getMinutes())} ${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())}`;
    editRange(str, ed.selectionStart, ed.selectionEnd);
    ed.focus();
  }

  // ---------- 検索・置換 ----------
  const panel = $('#findPanel');
  const findInput = $('#findInput'), replaceInput = $('#replaceInput');
  const findMsg = $('#findMsg');
  const escapeRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const flags = () => 'g' + ($('#optCase').checked ? '' : 'i') + 'u';
  const isUp = () => $('#dirUp').checked;

  function setMsg(text, ok) { findMsg.textContent = text; findMsg.classList.toggle('ok', !!ok); }

  function openFind(replaceMode) {
    closeMenu();
    panel.hidden = false;
    panel.classList.toggle('replace', !!replaceMode);
    $('#findTitle').textContent = replaceMode ? '置換' : '検索';
    $('#toggleReplace').textContent = replaceMode ? '検索だけにする' : '置換も行う';
    const s = ed.selectionStart, e = ed.selectionEnd;
    if (s !== e && e - s < 200) {
      const sel = ed.value.slice(s, e);
      if (!sel.includes('\n')) findInput.value = sel;
    }
    setMsg('');
    findInput.focus();
    findInput.select();
  }
  function closeFind() {
    panel.hidden = true;
    clearHighlight();
    ed.focus({ preventScroll: true });
  }

  function findNext(up) {
    const term = findInput.value;
    if (!term) { openFind(panel.classList.contains('replace')); setMsg('検索する文字列を入力してください。'); return false; }
    const text = ed.value;
    const re = new RegExp(escapeRe(term), flags());
    const wrap = $('#optWrap').checked;
    let m = null;
    if (!up) {
      re.lastIndex = ed.selectionEnd;
      m = re.exec(text);
      if (!m && wrap) { re.lastIndex = 0; m = re.exec(text); }
    } else {
      const start = ed.selectionStart;
      let x, last = null, any = null;
      re.lastIndex = 0;
      while ((x = re.exec(text))) {
        if (x.index < start) last = x;
        any = x;
        if (x.index >= start && !wrap) break;
      }
      m = last || (wrap ? any : null);
    }
    if (!m) { setMsg(`「${term}」が見つかりません。`); return false; }
    setMsg('');
    selectRange(m.index, m.index + m[0].length);
    return true;
  }

  function replaceOne() {
    const term = findInput.value;
    if (!term) { setMsg('検索する文字列を入力してください。'); return; }
    const s = ed.selectionStart, e = ed.selectionEnd;
    const re = new RegExp('^' + escapeRe(term) + '$', flags().replace('g', ''));
    if (s !== e && re.test(ed.value.slice(s, e))) {
      editRange(replaceInput.value, s, e, 'end');
    }
    findNext(isUp());
  }

  function replaceAll() {
    const term = findInput.value;
    if (!term) { setMsg('検索する文字列を入力してください。'); return; }
    const re = new RegExp(escapeRe(term), flags());
    let n = 0;
    const rep = replaceInput.value;
    const out = ed.value.replace(re, () => { n++; return rep; });
    if (!n) { setMsg(`「${term}」が見つかりません。`); return; }
    const top = ed.scrollTop, left = ed.scrollLeft;
    editRange(out, 0, ed.value.length, 'start');
    ed.setSelectionRange(0, 0);
    ed.scrollTop = top; ed.scrollLeft = left;
    scheduleStatus(false);
    setMsg(`${n} 件置換しました。`, true);
  }

  $('#btnFindNext').addEventListener('click', () => findNext(isUp()));
  $('#btnReplace').addEventListener('click', replaceOne);
  $('#btnReplaceAll').addEventListener('click', replaceAll);
  $('#findClose').addEventListener('click', closeFind);
  $('#toggleReplace').addEventListener('click', () => openFind(!panel.classList.contains('replace')));
  findInput.addEventListener('input', () => setMsg(''));
  panel.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); closeFind(); return; }
    if (e.key === 'Enter' && !e.isComposing && e.target.tagName === 'INPUT' && e.target.type === 'text') {
      e.preventDefault();
      if (e.target === replaceInput) replaceOne(); else findNext(e.shiftKey ? !isUp() : isUp());
    }
  });

  // ---------- コマンド一覧 ----------
  const commands = {
    async new() { if (await confirmDiscard()) newDoc(); },
    async open() { if (await confirmDiscard()) fileInput.click(); },
    save: () => save(false),
    saveAs: () => save(true),
    undo: () => { undo(); ed.focus(); },
    redo: () => { redo(); ed.focus(); },
    cut: () => copySel(true),
    copy: () => copySel(false),
    paste,
    del: delSel,
    find: () => openFind(false),
    replace: () => openFind(true),
    findNext: () => { if (findInput.value) findNext(false); else openFind(false); },
    findPrev: () => { if (findInput.value) findNext(true); else openFind(false); },
    selectAll: () => { ed.focus(); ed.select(); scheduleStatus(false); },
    dateTime: insertDateTime,
    font: fontDialog,
    zoomIn: () => setZoom(settings.zoom + 10),
    zoomOut: () => setZoom(settings.zoom - 10),
    zoomReset: () => setZoom(100),
    wrap: () => { settings.wrap = !settings.wrap; applySettings(); },
    status: () => { settings.status = !settings.status; applySettings(); },
  };
  const run = (cmd) => { const f = commands[cmd]; if (f) f(); };

  // ---------- メニュー ----------
  const menus = [...document.querySelectorAll('.menu')];
  let openMenuEl = null;
  function refreshMenuState() {
    const hasSel = ed.selectionStart !== ed.selectionEnd;
    const set = (cmd, on) => { const b = document.querySelector(`[data-cmd="${cmd}"]`); if (b) b.disabled = !on; };
    set('undo', H.undo.length > 0);
    set('redo', H.redo.length > 0);
    set('cut', hasSel);
    set('copy', hasSel);
    set('del', hasSel || ed.selectionStart < ed.value.length);
    set('findNext', ed.value.length > 0);
    set('findPrev', ed.value.length > 0);
    document.querySelectorAll('[role="menuitemcheckbox"]').forEach((b) => {
      b.querySelector('.ck').textContent = b.getAttribute('aria-checked') === 'true' ? '✓' : '';
    });
  }
  function openMenu(m, focusFirst) {
    if (openMenuEl === m) return;
    closeMenu();
    openMenuEl = m;
    refreshMenuState();
    m.classList.add('open');
    m.querySelector('.menu-btn').setAttribute('aria-expanded', 'true');
    const dd = m.querySelector('.dropdown');
    if (window.matchMedia('(max-width: 640px)').matches) {
      const r = m.getBoundingClientRect();
      dd.style.top = r.bottom + 'px';
      dd.style.left = Math.max(4, Math.min(r.left, window.innerWidth - dd.offsetWidth - 4)) + 'px';
    } else {
      dd.style.top = ''; dd.style.left = '';
    }
    if (focusFirst) { const f = items(m)[0]; if (f) f.focus(); }
  }
  function closeMenu(refocus) {
    if (!openMenuEl) return;
    const hadFocus = openMenuEl.contains(document.activeElement);
    openMenuEl.classList.remove('open');
    openMenuEl.querySelector('.menu-btn').setAttribute('aria-expanded', 'false');
    openMenuEl = null;
    if (refocus || hadFocus) ed.focus({ preventScroll: true });
  }
  const items = (m) => [...m.querySelectorAll('.dropdown button')].filter((b) => !b.disabled);

  menus.forEach((m, mi) => {
    const btn = m.querySelector('.menu-btn');
    // マウス操作でエディタのフォーカス（選択範囲）を奪わない
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => { if (openMenuEl === m) closeMenu(); else openMenu(m, false); });
    btn.addEventListener('mouseenter', () => { if (openMenuEl && openMenuEl !== m) openMenu(m, false); });
    btn.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openMenu(m, true); }
    });
    m.querySelectorAll('.dropdown button').forEach((b) => {
      b.addEventListener('mousedown', (e) => e.preventDefault());
      b.addEventListener('click', () => { closeMenu(true); run(b.dataset.cmd); });
    });
    m.querySelector('.dropdown').addEventListener('keydown', (e) => {
      const list = items(m);
      const i = list.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); list[(i + 1) % list.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); list[(i - 1 + list.length) % list.length].focus(); }
      else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        e.preventDefault();
        const next = menus[(mi + (e.key === 'ArrowRight' ? 1 : -1) + menus.length) % menus.length];
        openMenu(next, true);
      }
      else if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); }
      else if (e.key === 'Tab') closeMenu(true);
    });
  });
  document.addEventListener('pointerdown', (e) => {
    if (openMenuEl && !openMenuEl.contains(e.target)) closeMenu();
  });

  // ---------- キーボードショートカット ----------
  window.addEventListener('keydown', (e) => {
    if (modalDepth > 0) return;
    const mod = e.ctrlKey || e.metaKey;
    const k = (e.key || '').toLowerCase();
    const inEditor = e.target === ed;

    if (e.key === 'Escape' && openMenuEl) { e.preventDefault(); closeMenu(true); return; }

    if (e.altKey && !mod && !e.shiftKey) {
      const m = menus.find((x) => x.dataset.key === k);
      if (m) { e.preventDefault(); openMenu(m, true); return; }
    }

    if (e.key === 'F3') { e.preventDefault(); run(e.shiftKey ? 'findPrev' : 'findNext'); return; }
    if (e.key === 'F5' && inEditor) { e.preventDefault(); insertDateTime(); return; }

    if (!mod) {
      if (inEditor && e.key === 'Tab' && !e.shiftKey && !e.altKey) {
        e.preventDefault();
        editRange('\t', ed.selectionStart, ed.selectionEnd, 'end', 'type');
      }
      return;
    }

    if (e.altKey && k === 'n') { e.preventDefault(); run('new'); return; }
    if (e.altKey) return;

    switch (k) {
      case 'o': e.preventDefault(); run('open'); return;
      case 's': e.preventDefault(); run(e.shiftKey ? 'saveAs' : 'save'); return;
      case 'f': e.preventDefault(); run('find'); return;
      case 'h': e.preventDefault(); run('replace'); return;
      case '+': case '=': case ';': e.preventDefault(); run('zoomIn'); return;
      case '-': case '_': e.preventDefault(); run('zoomOut'); return;
      case '0': e.preventDefault(); run('zoomReset'); return;
    }
    if (inEditor) {
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
      if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); return; }
    }
  });

  // Ctrl + ホイールで拡大・縮小
  ed.addEventListener('wheel', (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    setZoom(settings.zoom + (e.deltaY < 0 ? 10 : -10));
  }, { passive: false });

  // ---------- 起動時：前回の内容を復元 ----------
  const saved = parse(store.get(KEY_DOC));
  if (typeof saved.text === 'string') {
    ed.value = saved.text;
    doc.name = typeof saved.name === 'string' ? saved.name : '';
    doc.dirty = !!saved.dirty;
    doc.eol = saved.eol === 'LF' ? 'LF' : 'CRLF';
    const len = ed.value.length;
    const s = Math.min(Number(saved.s) || 0, len), e = Math.min(Number(saved.e) || 0, len);
    ed.setSelectionRange(s, Math.max(s, e));
    requestAnimationFrame(() => { ed.scrollTop = Number(saved.top) || 0; });
    if (saved.text.length) toast('前回の内容を復元しました');
  }
  applySettings();
  updateTitle();
  totalCount = countChars(ed.value);
  renderStatus();
  ed.focus({ preventScroll: true });
})();
</script>
</body>
</html>
